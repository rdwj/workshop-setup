# Control plane Machine — master-1
#
# This is a copy of master-0's providerSpec with the name changed.
# The Machine API will provision a new EC2 instance and the etcd
# operator will automatically add it to the etcd cluster.
#
# Key fields that MUST match master-0:
#   - labels (cluster-api-machine-role: master)
#   - ami, instanceType, iamInstanceProfile
#   - loadBalancers (both int and ext)
#   - securityGroups (node + lb + controlplane)
#   - userDataSecret (master-user-data, NOT worker-user-data)
#
apiVersion: machine.openshift.io/v1beta1
kind: Machine
metadata:
  name: cluster-kbm2h-vpnwm-master-1
  namespace: openshift-machine-api
  labels:
    machine.openshift.io/cluster-api-cluster: cluster-kbm2h-vpnwm
    machine.openshift.io/cluster-api-machine-role: master
    machine.openshift.io/cluster-api-machine-type: master
spec:
  metadata: {}
  providerSpec:
    value:
      apiVersion: machine.openshift.io/v1beta1
      kind: AWSMachineProviderConfig
      ami:
        id: ami-0a611e6a24a551a2b
      instanceType: m6a.2xlarge
      blockDevices:
        - ebs:
            encrypted: true
            iops: 0
            kmsKey:
              arn: ""
            volumeSize: 100
            volumeType: gp2
      iamInstanceProfile:
        id: cluster-kbm2h-vpnwm-master-profile
      credentialsSecret:
        name: aws-cloud-credentials
      placement:
        availabilityZone: us-east-2b
        region: us-east-2
      deviceIndex: 0
      subnet:
        filters:
          - name: tag:Name
            values:
              - cluster-kbm2h-vpnwm-subnet-private-us-east-2b
      securityGroups:
        - filters:
            - name: tag:Name
              values:
                - cluster-kbm2h-vpnwm-node
        - filters:
            - name: tag:Name
              values:
                - cluster-kbm2h-vpnwm-lb
        - filters:
            - name: tag:Name
              values:
                - cluster-kbm2h-vpnwm-controlplane
      loadBalancers:
        - name: cluster-kbm2h-vpnwm-int
          type: network
        - name: cluster-kbm2h-vpnwm-ext
          type: network
      tags:
        - name: kubernetes.io/cluster/cluster-kbm2h-vpnwm
          value: owned
        - name: Stack
          value: project ocp4-cluster-kbm2h
        - name: env_type
          value: ocp4-cluster
        - name: guid
          value: kbm2h
        - name: owner
          value: unknown
        - name: platform
          value: RHPDS
        - name: uuid
          value: e0a6c73c-d9b5-5568-97f6-d2c00dc4ad9d
      userDataSecret:
        name: master-user-data
      metadataServiceOptions: {}
      capacityReservationId: ""
      metadata:
        creationTimestamp: null
