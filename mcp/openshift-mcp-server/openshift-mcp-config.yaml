apiVersion: v1
kind: ConfigMap
metadata:
  name: openshift-mcp-server-config
  namespace: openshift-mcp
data:
  config.toml: |
    log_level = 2
    port = "8080"
    read_only = true
    disable_destructive = true
    toolsets = ["core", "config"]

    [[denied_resources]]
    group = ""
    version = "v1"
    kind = "Secret"
