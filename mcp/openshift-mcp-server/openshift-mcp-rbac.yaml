apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-viewer
  namespace: openshift-mcp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-viewer-binding
subjects:
- kind: ServiceAccount
  name: mcp-viewer
  namespace: openshift-mcp
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
