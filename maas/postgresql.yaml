apiVersion: v1
kind: Namespace
metadata:
  name: maas-postgresql
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: maas-postgresql-data
  namespace: maas-postgresql
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: maas-postgresql-credentials
  namespace: maas-postgresql
type: Opaque
stringData:
  POSTGRES_USER: maasadmin
  POSTGRES_PASSWORD: REDACTED_PASSWORD
  POSTGRES_DB: maasdb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-postgresql
  namespace: maas-postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maas-postgresql
  template:
    metadata:
      labels:
        app: maas-postgresql
    spec:
      containers:
        - name: postgresql
          image: registry.redhat.io/rhel9/postgresql-16:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: maas-postgresql-credentials
                  key: POSTGRES_USER
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: maas-postgresql-credentials
                  key: POSTGRES_PASSWORD
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: maas-postgresql-credentials
                  key: POSTGRES_DB
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: maas-postgresql-data
---
apiVersion: v1
kind: Service
metadata:
  name: maas-postgresql
  namespace: maas-postgresql
spec:
  selector:
    app: maas-postgresql
  ports:
    - port: 5432
      targetPort: 5432
