---
apiVersion: v1
kind: Namespace
metadata:
  name: finops
  labels:
    opendatahub.io/dashboard: "true"
---
apiVersion: perses.dev/v1alpha2
kind: Perses
metadata:
  name: finops-perses
  namespace: finops
spec:
  config:
    security:
      readonly: false
      enable_auth: false
      cookie:
        secure: false
---
apiVersion: perses.dev/v1alpha2
kind: PersesDatasource
metadata:
  name: thanos-querier
  namespace: finops
spec:
  config:
    display:
      name: "Thanos Querier"
    default: true
    plugin:
      kind: PrometheusDatasource
      spec:
        directUrl: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
