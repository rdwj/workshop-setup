apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sample-workbench-pvc
  namespace: sample-project
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: kubeflow.org/v1
kind: Notebook
metadata:
  name: sample-workbench
  namespace: sample-project
  labels:
    app: sample-workbench
    opendatahub.io/dashboard: "true"
    opendatahub.io/odh-managed: "true"
  annotations:
    notebooks.opendatahub.io/inject-oauth: "true"
    opendatahub.io/image-display-name: "Standard Data Science"
spec:
  template:
    spec:
      containers:
        - name: sample-workbench
          image: image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/s2i-generic-data-science-notebook:2024.2
          resources:
            limits:
              cpu: "2"
              memory: 8Gi
            requests:
              cpu: "1"
              memory: 4Gi
          ports:
            - containerPort: 8888
              name: notebook-port
              protocol: TCP
          env:
            - name: NOTEBOOK_ARGS
              value: |-
                --ServerApp.port=8888
                --ServerApp.token=''
                --ServerApp.password=''
                --ServerApp.base_url=/notebook/sample-project/sample-workbench
                --ServerApp.quit_button=False
          volumeMounts:
            - name: workbench-data
              mountPath: /opt/app-root/src
          readinessProbe:
            httpGet:
              path: /notebook/sample-project/sample-workbench/api
              port: notebook-port
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /notebook/sample-project/sample-workbench/api
              port: notebook-port
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: workbench-data
          persistentVolumeClaim:
            claimName: sample-workbench-pvc
