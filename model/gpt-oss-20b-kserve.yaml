---
apiVersion: v1
kind: Namespace
metadata:
  name: gpt-oss-model
  labels:
    opendatahub.io/dashboard: "true"
---
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-gpt-oss-runtime
  namespace: gpt-oss-model
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    opendatahub.io/apiProtocol: REST
    opendatahub.io/template-display-name: "vLLM GPT-OSS 20B Runtime"
    opendatahub.io/template-name: vllm-gpt-oss-runtime
    openshift.io/display-name: "vLLM GPT-OSS 20B Runtime"
spec:
  annotations:
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
    io.kubernetes.cri-o.LogSizeMax: "104857600"
  multiModel: false
  supportedModelFormats:
    - autoSelect: true
      name: vLLM
  containers:
    - name: kserve-container
      image: registry.redhat.io/rhaiis/vllm-cuda-rhel9:3
      command:
        - python3
        - -m
        - vllm.entrypoints.openai.api_server
      args:
        - --port=8080
        - --model=/mnt/models
        - --dtype=bfloat16
        - --max-model-len=131072
        - --kv-cache-dtype=fp8_e4m3
        - --gpu-memory-utilization=0.95
        - --max-num-seqs=8
        - --enforce-eager
        - --enable-auto-tool-choice
        - --tool-call-parser=openai
        - --enable-prefix-caching
        - --enable-prompt-tokens-details
        - --enable-server-load-tracking
      env:
        - name: HOME
          value: /tmp/home
        - name: HF_HOME
          value: /tmp/hf-cache
      ports:
        - containerPort: 8080
          protocol: TCP
      resources:
        requests:
          cpu: "4"
          memory: 16Gi
        limits:
          cpu: "8"
          memory: 32Gi
      volumeMounts:
        - name: shm
          mountPath: /dev/shm
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 8Gi
    - name: tmp
      emptyDir: {}
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: gpt-oss-20b
  namespace: gpt-oss-model
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
    # Single-GPU deployments deadlock with RollingUpdate since the new pod
    # can't acquire the GPU until the old pod releases it.
    serving.kserve.io/deploymentStrategy: Recreate
    openshift.io/display-name: "GPT-OSS 20B"
spec:
  predictor:
    model:
      modelFormat:
        name: vLLM
      runtime: vllm-gpt-oss-runtime
      storageUri: "hf://RedHatAI/gpt-oss-20b"
      resources:
        requests:
          nvidia.com/gpu: "1"
        limits:
          nvidia.com/gpu: "1"
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
