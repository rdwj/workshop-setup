---
apiVersion: v1
kind: Namespace
metadata:
  name: gpt-oss-model
  labels:
    opendatahub.io/dashboard: "true"
---
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: gpt-oss-20b-maas
  namespace: gpt-oss-model
  labels:
    opendatahub.io/dashboard: "true"
spec:
  model:
    uri: hf://RedHatAI/gpt-oss-20b
    name: gpt-oss-20b
  replicas: 1
  template:
    containers:
      - name: kserve-container
        image: registry.redhat.io/rhaiis/vllm-cuda-rhel9:3
        command:
          - python3
          - -m
          - vllm.entrypoints.openai.api_server
        args:
          - --port=8080
          - --model=/mnt/models
          - --served-model-name=gpt-oss-20b
          - --dtype=bfloat16
          - --max-model-len=131072
          - --kv-cache-dtype=fp8_e4m3
          - --gpu-memory-utilization=0.95
          - --max-num-seqs=8
          - --enforce-eager
          - --enable-auto-tool-choice
          - --tool-call-parser=openai
          - --enable-prefix-caching
          - --enable-prompt-tokens-details
          - --enable-server-load-tracking
        env:
          - name: HOME
            value: /tmp/home
          - name: HF_HOME
            value: /tmp/hf-cache
        ports:
          - containerPort: 8080
            protocol: TCP
        resources:
          requests:
            cpu: "4"
            memory: 16Gi
            nvidia.com/gpu: "1"
          limits:
            cpu: "8"
            memory: 32Gi
            nvidia.com/gpu: "1"
        volumeMounts:
          - name: shm
            mountPath: /dev/shm
          - name: tmp
            mountPath: /tmp
          - name: kserve-provision-location
            mountPath: /mnt/models
    volumes:
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
      - name: tmp
        emptyDir: {}
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
