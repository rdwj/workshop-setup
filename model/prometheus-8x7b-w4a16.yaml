---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-8x7b-w4a16-cache
  namespace: judge-model
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-8x7b-w4a16
  namespace: judge-model
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus-8x7b-w4a16
  template:
    metadata:
      labels:
        app: prometheus-8x7b-w4a16
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          args:
            - --model
            - wjacksonrd/prometheus-8x7b-v2.0-W4A16
            - --port
            - "8000"
            - --dtype
            - bfloat16
            - --max-model-len
            - "32768"
            - --gpu-memory-utilization
            - "0.9"
            - --enable-prefix-caching
            - --enable-prompt-tokens-details
            - --enable-server-load-tracking
          env:
            - name: HOME
              value: /tmp/home
            - name: HF_HOME
              value: /models/huggingface
            - name: TRANSFORMERS_CACHE
              value: /models/huggingface
            - name: VLLM_CACHE_DIR
              value: /models/vllm-cache
            - name: XDG_CACHE_HOME
              value: /tmp/cache
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 180
            periodSeconds: 15
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 10
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
            - name: tmp-cache
              mountPath: /tmp/cache
            - name: tmp-home
              mountPath: /tmp/home
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: prometheus-8x7b-w4a16-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
        - name: tmp-cache
          emptyDir: {}
        - name: tmp-home
          emptyDir: {}
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-8x7b-w4a16
  namespace: judge-model
  labels:
    app: prometheus-8x7b-w4a16
spec:
  selector:
    app: prometheus-8x7b-w4a16
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: prometheus-8x7b-w4a16
  namespace: judge-model
spec:
  to:
    kind: Service
    name: prometheus-8x7b-w4a16
  port:
    targetPort: 8000
  tls:
    termination: edge
